schema_version: 1
profile_name: rabbit-default-authorized-scope

authorization:
  status: authorized
  engagement_type: internal-security-review
  asset_owner: self-owned-or-explicitly-authorized
  exposure_type: public-private-authorized-target
  environment_type: lab-or-authorized-production-like

scope:
  restrict_to_origin_targets: true
  allow_loopback_targets: false
  allow_private_targets: false
  allow_link_local_targets: false
  blocked_hosts:
    - localhost
    - host.docker.internal
    - gateway.docker.internal
  allowed_actions:
    - analyze
    - verify
    - summarize
    - report
  disallowed_actions:
    - persistence
    - destructive-actions
    - lateral-movement-out-of-scope

output:
  language: en
  evidence_first: true
  distinguish_confirmed_vs_unverified: true
  report_focus:
    - front-entry
    - backend-endpoint
    - key-parameters
    - dangerous-logic
    - observable-result
    - impact
    - root-cause
    - remediation

project_defaults:
  target_summary: ""
  goal: ""
  notes: ""

prompt_preamble: |
  This project is an authorized security test, an internal security review, or validation of a lab you own.
  The target may be reachable from the public internet, but it is a private use of a public address, an internal
  system, or an explicitly authorized test scope. Do not treat it as an unauthorized third-party target by default.
  Stay inside that boundary: analyze facts, map attack paths, judge risk, organize proof, and write the report.
  Do not invent facts. Keep confirmed, unverified, and speculative conclusions distinct. Write in English.
